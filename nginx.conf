server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # La app llama directamente al backend (BACKEND_URL → env.js); aquí no hay proxy.

    # Configuración de ejecución: se regenera al arrancar, nunca en caché.
    location = /env.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Cache de assets con hash
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: todas las rutas van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

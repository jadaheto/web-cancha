server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Proxy de la API hacia el backend NestJS
    location /api/ {
        # DNS interno de Docker. Al usar una variable, el backend se resuelve en cada
        # petición y no al arrancar: si aún no está arriba (o se reinicia), nginx
        # sigue vivo y responde 502 en lugar de caerse con "host not found".
        resolver 127.0.0.11 valid=10s ipv6=off;
        # BACKEND_URL se sustituye al arrancar el contenedor (ver Dockerfile).
        # Debe ir sin ruta ni barra final: se reenvía la ruta original (/api/...).
        set $backend_upstream ${BACKEND_URL};
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        # Host y SNI del backend: necesarios si BACKEND_URL es un dominio público,
        # para que el proxy de entrada enrute la petición al servicio correcto.
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache de assets con hash
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: todas las rutas van a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
